name: Career email tracker

on:
  schedule:
    # 12:00 UTC = 20:00 Asia/Shanghai.
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '首次部署请选择 bootstrap；之后手动补跑请选择 sync'
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - sync

permissions:
  contents: read

concurrency:
  group: career-email-tracker
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Read mailbox and update Feishu
        run: |
          if [ "$RUN_MODE" = "bootstrap" ]; then
            python -m career_tracker cloud-bootstrap
          else
            python -m career_tracker cloud-run
          fi
        env:
          RUN_MODE: ${{ github.event.inputs.mode || 'sync' }}
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
          MAIL_AUTH_CODE: ${{ secrets.MAIL_AUTH_CODE }}
          MAIL_IMAP_HOST: ${{ secrets.MAIL_IMAP_HOST }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_NOTIFY_WEBHOOK: ${{ secrets.FEISHU_NOTIFY_WEBHOOK }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
